# รันทั้งระบบด้วย Docker (คู่มือ: docs/DOCKER.md)
#   docker compose up -d --build
# เข้าใช้ผ่าน HTTPS ที่ reverse proxy (Caddy) ตัวเดียว:
#   https://<host>/        แชทบอท       (apps/chat-web)
#   https://<host>/admin/  ระบบแอดมิน   (apps/admin-web)
#   https://<host>/api/    Backend API  (services/api)
# port เดิม 5173 / 5174 / 8080 กลายเป็นตัว redirect ไป HTTPS (bookmark เดิมยังใช้ได้)
# backend เปิดเฉพาะ 127.0.0.1:8000 ไว้ให้เครื่องเซิร์ฟเวอร์เองใช้ตรวจ/ดูแล — เครื่องอื่นต้องผ่าน HTTPS
# (ชนกับ dev server — ปิด infra/scripts/dev.py ก่อน)
# ฐานข้อมูลหลักยังเป็น TiDB Cloud ตามเดิม ไม่มี container ฐานข้อมูล
name: tuh-chatbot

# log ของทุก service หมุนเวียน ไม่ให้เต็มดิสก์
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: ./services/api
    env_file: services/api/.env
    environment:
      # ทับค่า path ของเครื่อง Windows ใน services/api/.env ด้วย path ใน container
      DATA_DIR: /app
      CHROMA_DB_DIR: /data/chroma
      TESSERACT_CMD: ""
      # ชื่อเครื่องเซิร์ฟเวอร์สำหรับ CORS (CORS_EXTRA_HOSTS) ตั้งใน services/api/.env — ไม่ใส่ในไฟล์นี้เพราะ repo เป็น public
      # คำขอจากเครื่องอื่นเข้ามาทาง proxy เท่านั้น — X-Forwarded-For ที่ proxy ตั้งให้จึงเชื่อได้ (ใช้แยก IP ของ rate limit)
      TRUST_PROXY_HEADERS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # ChromaDB กับ index_db/ (bm25.pkl, sample_chunks.json) ต้องมาจาก rebuild ครั้งเดียวกันเสมอ — ย้าย/สำรองคู่กัน
      - chroma:/data/chroma
      - index_db:/app/index_db
      - uploads:/app/uploads
      # โมเดล bge-m3 (~2 GB) + ข้อมูลตัดคำ PyThaiNLP — ไม่ต้องดาวน์โหลดใหม่ทุกครั้งที่สร้าง container
      - model_cache:/cache
    networks: [api]
    # ใช้งานปกติ ~1 GB — เผื่อตอนทำ embedding / OCR เอกสารใหญ่ (ปรับได้ตาม RAM ของ VM)
    deploy:
      resources:
        limits:
          memory: 5g
    # รันเป็น user ธรรมดา (uid 1000 ใน image) ไม่ต้องใช้ capability ใดของ Linux
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped

  userweb:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: apps/chat-web
        VITE_API_URL: same-origin
    depends_on:
      - backend
    networks: [web]
    <<: &static-site
      deploy:
        resources:
          limits:
            memory: 128m
      security_opt: ["no-new-privileges:true"]
      # nginx: master รันเป็น root เพื่อ bind port 80 แล้วสลับไป user nginx — ต้องการแค่ capability ชุดนี้
      cap_drop: [ALL]
      cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE, DAC_OVERRIDE]
      healthcheck:
        test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
        interval: 30s
        timeout: 5s
        retries: 3
      logging: *logging
      restart: unless-stopped

  adminweb:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        APP: apps/admin-web
        VITE_API_URL: same-origin
        BASE: /admin/
    depends_on:
      - backend
    networks: [web]
    <<: *static-site

  # Reverse proxy + TLS — ทุกคำขอจากเครื่องอื่นเข้าทางนี้ทางเดียว
  proxy:
    image: caddy:2.10-alpine
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    environment:
      # ชื่อ/IP ที่ผู้ใช้ใช้เปิดเว็บ (คั่นด้วย ,) — ใบรับรองออกให้ตามรายการนี้ ตั้งใน .env ที่ root ของ repo
      # (ไม่ใส่ค่าจริงในไฟล์นี้เพราะ repo เป็น public) ไม่ตั้ง = localhost อย่างเดียว
      TLS_HOSTS: ${TLS_HOSTS:-localhost}
      # ชื่อหลักของเครื่อง — คนที่เปิดด้วย IP (bookmark เดิม http://<IP>:5173) ถูกส่งไปที่ชื่อนี้แทน
      TLS_PRIMARY_HOST: ${TLS_PRIMARY_HOST:-localhost}
    ports:
      - "443:443"
      - "5173:5173"
      - "5174:5174"
      - "8080:8080"
      # port 80 (redirect http → https) ปิดไว้ — เครื่อง Windows นี้ระบบใช้ port 80 อยู่ บน VM Linux เพิ่ม "80:80" ได้
    volumes:
      # CA ภายใน + ใบรับรองที่ Caddy ออกให้ — ต้องเก็บไว้ ไม่งั้นทุกเครื่องต้องติดตั้ง CA ใหม่
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - userweb
      - adminweb
    # proxy อยู่ทั้งสองวง — userweb/adminweb (วง web) ต่อ backend (วง api) ตรงๆ ไม่ได้
    networks: [web, api]
    deploy:
      resources:
        limits:
          memory: 256m
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--no-check-certificate", "https://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging
    restart: unless-stopped

networks:
  web:
  api:

configs:
  # เขียนเนื้อหาไว้ตรงนี้ (Docker Desktop bind mount ไฟล์จากไดรฟ์ Z: ไม่ได้) — $$ = $ ของ Caddy
  caddyfile:
    content: |
      {
        # ใบรับรองจาก CA ภายในของ Caddy (local_certs) — เปลี่ยนเป็นใบของโรงพยาบาลได้ ดู docs/DOCKER.md
        local_certs
        skip_install_trust
        # ปิด admin API ของ Caddy (เดิมฟังที่ localhost:2019 ใน container)
        admin off
      }

      # security headers ทุก response
      (security_headers) {
        header {
          X-Content-Type-Options "nosniff"
          X-Frame-Options "SAMEORIGIN"
          Referrer-Policy "strict-origin-when-cross-origin"
          Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
          -Server
        }
      }

      {$$TLS_HOSTS} {
        encode gzip
        import security_headers
        handle /api/* {
          # เพดานขนาด request (เอกสารอัปโหลดสูงสุด 50 MB ตั้งใน backend) — กันไฟล์ใหญ่ผิดปกติตั้งแต่หน้าประตู
          request_body {
            max_size 60MB
          }
          # X-Forwarded-For ที่ client ส่งมาถูกแทนด้วย IP จริงเสมอ (Caddy ไม่เชื่อ header จาก client โดย default)
          reverse_proxy backend:8000
        }
        redir /admin /admin/ 308
        handle_path /admin/* {
          # CKEditor 4 โหลดจาก cdn.ckeditor.com (สคริปต์ สไตล์ ไอคอน) — React ใช้ style inline จึงต้อง 'unsafe-inline' ที่ style
          # script ต้อง 'unsafe-inline' ด้วย: ปุ่มบน toolbar ของ CKEditor 4 เป็น onclick="..." ทั้งหมด (ทดสอบแล้ว ไม่ใส่ = พิมพ์ไม่ได้)
          # — ข้อจำกัดของ CKEditor 4 ที่หมดระยะ support แล้ว เปลี่ยนตัวแก้ไขเมื่อไหร่ให้เอาออก (แชทบอทไม่มีข้อยกเว้นนี้)
          # PDF ที่แอดมินเปิดเป็น blob: ใช้ตัวแสดง PDF ของเบราว์เซอร์ จึงต้องอนุญาต object/frame จาก blob:
          header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.ckeditor.com;style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.ckeditor.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://cdn.ckeditor.com; connect-src 'self' https://cdn.ckeditor.com; frame-src 'self' blob:; object-src 'self' blob:; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
          reverse_proxy adminweb:80
        }
        handle {
          header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
          reverse_proxy userweb:80
        }
        # HSTS: เปิดหลังทุกเครื่องเชื่อใบรับรองแล้วเท่านั้น — ถ้าเปิดตอนยังเป็น CA ภายใน ผู้ใช้จะกดข้ามคำเตือนไม่ได้
        # header Strict-Transport-Security "max-age=31536000"
      }

      # port เดิม → HTTPS (bookmark/ลิงก์เดิมยังใช้ได้)
      # เปิดด้วย IP → ส่งไปที่ชื่อหลักแทน: https://<IP> ใช้ไม่ได้ เพราะเบราว์เซอร์ไม่ส่งชื่อ (SNI) มากับ IP
      # Caddy จึงเลือกใบรับรองไม่ได้ (และ IP เปลี่ยนได้ตาม DHCP)
      (https_host) {
        map {host} {https_host} {
          ~^[0-9.]+$$ {$$TLS_PRIMARY_HOST}
          default {host}
        }
      }
      http://:5173 {
        import https_host
        redir https://{https_host}{uri} 308
      }
      http://:5174 {
        import https_host
        redir https://{https_host}/admin{uri} 308
      }
      http://:8080 {
        import https_host
        @admin path /tuh_chatbot_ai/admin*
        redir @admin https://{https_host}/admin/ 308
        redir https://{https_host}/ 308
      }

volumes:
  chroma:
  index_db:
  uploads:
  model_cache:
  caddy_data:
  caddy_config:
