name: CI

# ตรวจว่าทุกส่วน build ได้ — ไม่มี test อัตโนมัติ (ทดสอบด้วยการใช้งานจริงหลัง deploy)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: Backend (services/api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q services/api/app services/api/alembic services/api/scripts
      - name: Build Docker image
        run: docker build -t tuh-chatbot-api services/api

  web:
    name: Web (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [chat-web, admin-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - name: Install & build
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci
          npm run build
