name: TUH Chatbot AI v2 — CI/CD

on:
  push:
    branches: [main, new]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: 🐍 Backend Tests (FastAPI)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tuhchatbot
          POSTGRES_PASSWORD: tuhchatbot2026
          POSTGRES_DB: tuhchatbot
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd Backend
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: tuhchatbot
          POSTGRES_PASSWORD: tuhchatbot2026
          POSTGRES_DB: tuhchatbot
        run: |
          cd Backend
          pytest tests/ -v --tb=short

  # ─── Frontend Build ─────────────────────────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend Build (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: UserWeb/package-lock.json

      - name: Install & Build
        run: |
          cd UserWeb
          npm ci
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: UserWeb/dist/
