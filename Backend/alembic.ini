[alembic]
# ที่อยู่โฟลเดอร์ script ของ Alembic (relative กับไฟล์นี้)
script_location = alembic

# Template สำหรับตั้งชื่อไฟล์ migration ใหม่ๆ (revision id นำหน้าด้วย timestamp อ่านง่ายขึ้น)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# ไม่ใส่ sqlalchemy.url ตรงนี้โดยเจตนา — env.py จะดึงจาก app.core.config.settings
# (อ่านจาก .env) แทน กันไม่ให้ credential หลุดไปอยู่ในไฟล์ที่ commit เข้า git
timezone = Asia/Bangkok

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
